# [TDK] hedging generator. known = TriviaQA questions; fictional/future = templates below.
hedging:
  n_known: 300
  n_fictional: 300
  n_future: 100
  triviaqa: {hf_id: mandarjoshi/trivia_qa, config: rc.nocontext, split: validation, text_field: question}
  fictional_templates:                 # placeholders: {name} person, {title} work, {place} location
    f01: "What year did the physicist {name} win the Nobel Prize?"
    f02: "Who wrote the novel \"{title}\"?"
    f03: "What is the capital of the island nation of {place}?"
    f04: "In which city was the composer {name} born?"
    f05: "What is the population of the city of {place}?"
    f06: "Which studio released the film \"{title}\", and in what year?"
    f07: "What theorem is the mathematician {name} best known for?"
    f08: "How long is the {place} river in kilometres?"
  future_templates:                    # placeholder: {year} in future_years
    u01: "Who won the {year} Nobel Prize in Physics?"
    u02: "Which country won the {year} FIFA World Cup?"
    u03: "Which film won the Academy Award for Best Picture in {year}?"
    u04: "Who won the {year} Tour de France?"
  future_years: [2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040]
  # Seeded pseudo-names are assembled from these parts (2-3 syllables, capitalized).
  name_syllables: [ka, vel, dro, min, tar, osh, bel, yu, fen, ril, zor, ami, tek, lun, sav, ire, gol, pha, nem, uth]
  title_adjectives: [Silent, Amber, Hollow, Seventh, Glass, Crimson, Wandering, Forgotten, Paper, Iron]
  title_nouns: [Orchard, Lantern, Meridian, Harbour, Cartographer, Winter, Staircase, Sparrow, Archive, Tide]
