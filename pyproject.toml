[project]
name = "sae-behavior-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6",
  "transformers>=4.53,<6",
  "sae-lens>=6.51,<7",
  "huggingface-hub>=0.30",
  "safetensors>=0.5",
  "datasets>=3.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.6",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "requests>=2.32",
  "tqdm>=4.66",
  "joblib>=1.4",
  "matplotlib>=3.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
markers = ["hf: needs network + HF_TOKEN (real 270M model)", "gpu: needs CUDA"]
addopts = "-m 'not hf and not gpu'"
